name: Android APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug + release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Lint (API compatibility down to Android 5.0)
        run: |
          ./gradlew --no-daemon lintDebug
          REPORT=app/build/reports/lint-results.txt
          if [ -f "$REPORT" ]; then
            grep -E "\[(NewApi|InlinedApi|ObsoleteSdkInt|UnusedAttribute)\]" "$REPORT" | head -40 | while read -r line; do
              echo "::warning title=lint::$line"
            done
            tail -3 "$REPORT"
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ClaudeCodeMobile.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClaudeCodeMobile-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: ClaudeCodeMobile-apk
          path: android/dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v3
        with:
          files: android/dist/*.apk
          name: Claude Code Mobile ${{ github.ref_name }}
          make_latest: false
          body: |
            Native Android app (Kotlin + Jetpack Compose) — Claude Code style terminal UI on free OpenRouter models.
            Install `ClaudeCodeMobile.apk`, then paste your OpenRouter API key on first launch (it is stored encrypted on the device).
