name: Build ZIP package (Claude Code Desktop — Hamza Alfarai)

# يبني الملف المضغوط release/ClaudeCode-HamzaAlfarai.zip ويضمّن فيه
# أحدث إصدار مستقر من بايثون (مثبّت ويندوز الرسمي من python.org)
# + أحدث Python Install Manager (.msix)

on:
  workflow_dispatch:
  push:
    paths:
      - "claude_code_suite.py"
      - "README.md"
      - "install_python.bat"
      - "run_claude_code.bat"
      - "tools/**"
      - "scripts/build_package.py"
      - ".github/workflows/build-package.yml"

permissions:
  contents: write

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download latest Python + build ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_package.py
          echo "::notice title=Bundled Python::$(tr '\n' ' ' < release/PYTHON_VERSION.txt)"
          ls -la release/

      - name: Commit ZIP to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Build ZIP package with latest Python ($(head -1 release/PYTHON_VERSION.txt)) [skip ci]"
            if ! git push origin "HEAD:${GITHUB_REF_NAME}" > /tmp/push.log 2>&1; then
              echo "::error title=git push failed::$(tail -8 /tmp/push.log | tr '\n' ' ')"
              exit 1
            fi
          fi

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCode-HamzaAlfarai
          path: release/ClaudeCode-HamzaAlfarai.zip
